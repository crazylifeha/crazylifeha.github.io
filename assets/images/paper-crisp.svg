<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-crisp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#bg-crisp)" />
  <circle cx="200" cy="125" r="70" fill="none" stroke="url(#glow)" stroke-width="3" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="200" cy="125" r="45" fill="none" stroke="#60a5fa" stroke-width="2" />
  <circle cx="200" cy="125" r="8" fill="#38bdf8" />
  
  <!-- Neural connections / architecture lines -->
  <line x1="80" y1="60" x2="200" y2="125" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="80" y1="190" x2="200" y2="125" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="60" x2="200" y2="125" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  <line x1="320" y1="190" x2="200" y2="125" stroke="#818cf8" stroke-width="1.5" opacity="0.5"/>
  
  <rect x="50" y="45" width="60" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="65" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">RGB</text>
  
  <rect x="50" y="175" width="60" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="195" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Depth</text>

  <rect x="290" y="45" width="60" height="30" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="65" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Prompt</text>
  
  <rect x="290" y="175" width="60" height="30" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="320" y="195" fill="#f8fafc" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Output</text>

  <text x="200" y="230" fill="#cbd5e1" font-size="13" font-family="sans-serif" font-weight="600" text-anchor="middle" letter-spacing="1">CRISP Architecture</text>
